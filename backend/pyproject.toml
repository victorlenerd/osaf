[project]
name = "afefehub-backend"
version = "0.1.0"
description = "Afefehub: Meta-model-powered agent that turns Instagram reel and WhatsApp voice-note reviews into a searchable business history"
readme = { text = "Afefehub backend. See the README at the repository root: https://github.com/victorlenerd/osaf", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "openai>=1.50",
    "boto3>=1.35",
    "opensearch-py>=2.7",
    "requests-aws4auth>=1.3",
    "yt-dlp>=2025.1.1",
    "python-ulid>=2.7",
    "python-multipart>=0.0.9",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "respx>=0.21"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/agent/prompts.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
